name: Release FPK (fnOS)

# 推送形如 v1.2.0 的 tag 时，自动编译 x86 / arm 两套 fnOS 安装包并发布到 Releases。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-fpk-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} FPK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            goarch: amd64
          - arch: arm
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          APP_VERSION="$(grep -o 'AppVersion *= *"[^"]*"' core/version.go | head -n1 | sed 's/.*"\(.*\)"/\1/')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "打包版本: ${VERSION} (代码内版本: ${APP_VERSION})"
          if [ "${VERSION}" != "${APP_VERSION}" ]; then
            echo "::warning::标签 ${TAG} 与 core/version.go 的 ${APP_VERSION} 不一致，安装包版本以标签为准。"
          fi

      - name: Build FPK
        shell: bash
        env:
          MUSIC_DL_BUILD_IN_DOCKER: "0"
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail
          bash build-fpk.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.arch }}
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.fpk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.fpk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
