name: Release (fnOS + Android)

# 只编译 fnOS 安装包（x86 / arm）与 Android APK，统一在一个 workflow 里完成并发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag or source
        id: version
        shell: bash
        run: |
          version=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="$(sed -n 's/.*AppVersion *= *"\([^"]*\)".*/\1/p' core/version.go | head -n1)"
          fi
          if [ -z "$version" ]; then
            echo "::error::无法确定版本号"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

  build-fpk:
    name: Build FPK (${{ matrix.arch }})
    needs: resolve-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            goarch: amd64
          - arch: arm
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build FPK
        shell: bash
        env:
          MUSIC_DL_BUILD_IN_DOCKER: '0'
          GOPROXY: https://proxy.golang.org,direct
        run: |
          chmod +x build-fpk.sh
          bash build-fpk.sh "${{ needs.resolve-version.outputs.version }}" "${{ matrix.arch }}"

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.arch }}
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 3

  build-android:
    name: Build Android APK
    runs-on: windows-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default still includes the removed legacy "tools" package.
          packages: platform-tools

      - name: Resolve Android SDK Paths
        shell: cmd
        run: |
          set "SDKMANAGER="

          if not defined SDKMANAGER if defined ANDROID_SDK_ROOT if exist "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" set "SDKMANAGER=%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat"
          if not defined SDKMANAGER if defined ANDROID_SDK_ROOT if exist "%ANDROID_SDK_ROOT%\cmdline-tools\bin\sdkmanager.bat" set "SDKMANAGER=%ANDROID_SDK_ROOT%\cmdline-tools\bin\sdkmanager.bat"
          if not defined SDKMANAGER if defined ANDROID_HOME if exist "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" set "SDKMANAGER=%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat"
          if not defined SDKMANAGER if defined ANDROID_HOME if exist "%ANDROID_HOME%\cmdline-tools\bin\sdkmanager.bat" set "SDKMANAGER=%ANDROID_HOME%\cmdline-tools\bin\sdkmanager.bat"

          if not defined SDKMANAGER for /f "delims=" %%p in ('where sdkmanager.bat 2^>nul') do if not defined SDKMANAGER set "SDKMANAGER=%%p"

          if not defined SDKMANAGER (
            echo ERROR: sdkmanager.bat not found after setup-android.
            where sdkmanager.bat
            exit /b 1
          )

          set "DETECTED_ANDROID_HOME="
          if defined ANDROID_SDK_ROOT if exist "%ANDROID_SDK_ROOT%\cmdline-tools" set "DETECTED_ANDROID_HOME=%ANDROID_SDK_ROOT%"
          if not defined DETECTED_ANDROID_HOME if defined ANDROID_HOME if exist "%ANDROID_HOME%\cmdline-tools" set "DETECTED_ANDROID_HOME=%ANDROID_HOME%"

          if not defined DETECTED_ANDROID_HOME (
            for %%I in ("%SDKMANAGER%\..\..\..\..") do set "SDK_ROOT_CANDIDATE1=%%~fI"
            for %%I in ("%SDKMANAGER%\..\..\..") do set "SDK_ROOT_CANDIDATE2=%%~fI"

            if exist "%SDK_ROOT_CANDIDATE1%\cmdline-tools" (
              set "DETECTED_ANDROID_HOME=%SDK_ROOT_CANDIDATE1%"
            ) else (
              set "DETECTED_ANDROID_HOME=%SDK_ROOT_CANDIDATE2%"
            )
          )

          if not exist "%DETECTED_ANDROID_HOME%\platform-tools" mkdir "%DETECTED_ANDROID_HOME%\platform-tools"

          echo SDKMANAGER=%SDKMANAGER%>> %GITHUB_ENV%
          echo ANDROID_HOME=%DETECTED_ANDROID_HOME%>> %GITHUB_ENV%
          echo ANDROID_SDK_ROOT=%DETECTED_ANDROID_HOME%>> %GITHUB_ENV%

          echo Using SDKMANAGER=%SDKMANAGER%
          echo Using ANDROID_HOME=%DETECTED_ANDROID_HOME%

      - name: Install Android Packages
        shell: cmd
        run: |
          if not defined SDKMANAGER (
            echo ERROR: SDKMANAGER env is empty.
            exit /b 1
          )
          call "%SDKMANAGER%" --licenses < NUL
          call "%SDKMANAGER%" "platform-tools" "platforms;android-33" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Download Android FFmpeg binaries
        shell: powershell
        run: |
          .\.github\scripts\download_android_ffmpeg.ps1 -OutputRoot .\desktop_app\ffmpeg\android

      - name: Decode Android signing keystore
        shell: powershell
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          function Fail($message) {
            Write-Host "::error::$message"
            exit 1
          }

          # Keep this step ASCII-only: non-ASCII text in a PowerShell step can be
          # mis-decoded when the runner script file has no UTF-8 BOM, which breaks parsing.
          function Convert-Keystore($b64, $pass) {
            try {
              $bytes = [Convert]::FromBase64String(($b64 -replace '\s', ''))
            } catch {
              Write-Host "  base64 decode failed: $($_.Exception.Message)"
              return $null
            }
            if ($bytes.Length -lt 32) {
              Write-Host "  decoded only $($bytes.Length) bytes"
              return $null
            }
            $magic = ($bytes[0..1] | ForEach-Object { $_.ToString('X2') }) -join ' '
            if ($bytes[0] -ne 0x30) {
              Write-Host "  not a PKCS12/DER file (magic=$magic)"
              return $null
            }
            [IO.File]::WriteAllBytes("release.keystore", $bytes)
            Write-Host "  release.keystore size=$($bytes.Length) magic=$magic"
            if (Get-Command keytool -ErrorAction SilentlyContinue) {
              $keytoolOutput = & keytool -list -keystore release.keystore -storepass $pass 2>&1
              if ($LASTEXITCODE -ne 0) {
                ($keytoolOutput | Out-String) -split "`r?`n" | Where-Object { $_ -ne "" } | Select-Object -First 4 | ForEach-Object { Write-Host "  $_" }
                Write-Host "  keytool cannot read this keystore (wrong password or unsupported format)"
                return $null
              }
            }
            return $bytes
          }

          $storePass = $env:ANDROID_KEYSTORE_PASSWORD
          if ([string]::IsNullOrWhiteSpace($storePass)) {
            $storePass = "musicdl-release-2026"
          }

          $bytes = $null
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            Write-Host "keystore source: bundled .github/android/release.keystore.b64"
          } else {
            Write-Host "keystore source: repository secret ANDROID_KEYSTORE_BASE64"
            $bytes = Convert-Keystore $env:ANDROID_KEYSTORE_BASE64 $storePass
            if ($bytes) {
              Write-Host "using keystore from secret"
            } else {
              Write-Host "::warning::secret keystore is unusable, falling back to the bundled keystore"
              $storePass = "musicdl-release-2026"
            }
          }

          if (-not $bytes) {
            $fallbackPath = ".github/android/release.keystore.b64"
            if (-not (Test-Path $fallbackPath)) {
              Fail "No usable Android signing keystore: secret is empty or invalid and the bundled keystore is missing."
            }
            $storePass = "musicdl-release-2026"
            $bytes = Convert-Keystore (Get-Content $fallbackPath -Raw) $storePass
          }
          if (-not $bytes) {
            Fail "Android signing keystore is unusable: even the bundled keystore cannot be read by keytool."
          }

          # Export the effective password for the later build steps.
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_KEYSTORE_PASSWORD=$storePass" -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_KEYSTORE_FILE=..\release.keystore" -Encoding ascii
          Write-Host "keystore ready: size=$($bytes.Length) password length=$($storePass.Length)"

      - name: Build APK
        shell: cmd
        env:
          MUSIC_DL_BUNDLE_ANDROID_FFMPEG: "1"
        run: |
          package_app.bat

      - name: Remove Android signing keystore
        if: always()
        shell: cmd
        run: |
          del /q release.keystore

      - name: Verify APK
        shell: cmd
        run: |
          if not exist "music-dl.apk" (
            echo ERROR: music-dl.apk not found
            exit /b 1
          )
          if not exist "music-dl_arm64-v8a.apk" (
            echo ERROR: music-dl_arm64-v8a.apk not found
            exit /b 1
          )
          if not exist "music-dl_x86_64.apk" (
            echo ERROR: music-dl_x86_64.apk not found
            exit /b 1
          )

      - name: Verify bundled Android FFmpeg
        shell: powershell
        run: |
          .\.github\scripts\verify_android_ffmpeg_apk.ps1 -ApkPath .\music-dl.apk -Abis armeabi-v7a,arm64-v8a,x86,x86_64
          .\.github\scripts\verify_android_ffmpeg_apk.ps1 -ApkPath .\music-dl_arm64-v8a.apk -Abis arm64-v8a
          .\.github\scripts\verify_android_ffmpeg_apk.ps1 -ApkPath .\music-dl_x86_64.apk -Abis x86_64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            music-dl.apk
            music-dl_arm64-v8a.apk
            music-dl_x86_64.apk
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish release
    needs:
      - resolve-version
      - build-fpk
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          ls -lh
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.fpk
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Checkout main for fnpack.json
        uses: actions/checkout@v4
        with:
          ref: main
          path: fnpack-repo

      - name: Update FnDepot source
        shell: bash
        working-directory: fnpack-repo
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/update_fnpack.py \
            --repo . \
            --dist ../dist \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --tag "${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.resolve-version.outputs.version) }}"

      - name: Commit fnpack.json
        shell: bash
        working-directory: fnpack-repo
        run: |
          if git diff --quiet -- fnpack.json; then
            echo "fnpack.json 无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fnpack.json
          git commit -m "chore(fnpack): 发布 v${{ needs.resolve-version.outputs.version }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "推送失败，第 ${attempt} 次重试前先同步远端 main"
            git pull --rebase origin main
          done
          echo "::error::无法把 fnpack.json 推送到 main"
          exit 1
