name: Release (fnOS)

# 只编译 fnOS 安装包（x86 / arm）并发布，不再构建 Android APK。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag or source
        id: version
        shell: bash
        run: |
          version=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="$(sed -n 's/.*AppVersion *= *"\([^"]*\)".*/\1/p' core/version.go | head -n1)"
          fi
          if [ -z "$version" ]; then
            echo "::error::无法确定版本号"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

  build-fpk:
    name: Build FPK (${{ matrix.arch }})
    needs: resolve-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            goarch: amd64
          - arch: arm
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version files
        shell: bash
        run: bash .github/scripts/sync_version.sh "${{ needs.resolve-version.outputs.version }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build FPK
        shell: bash
        env:
          MUSIC_DL_BUILD_IN_DOCKER: '0'
          GOPROXY: https://proxy.golang.org,direct
        run: |
          chmod +x build-fpk.sh
          bash build-fpk.sh "${{ needs.resolve-version.outputs.version }}" "${{ matrix.arch }}"

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.arch }}
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish release
    needs:
      - resolve-version
      - build-fpk
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          ls -lh
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.fpk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Checkout main for fnpack.json
        uses: actions/checkout@v4
        with:
          ref: main
          path: fnpack-repo

      - name: Sync version files
        shell: bash
        working-directory: fnpack-repo
        run: bash .github/scripts/sync_version.sh "${{ needs.resolve-version.outputs.version }}"

      - name: Update FnDepot source
        shell: bash
        working-directory: fnpack-repo
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/update_fnpack.py \
            --repo . \
            --dist ../dist \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --tag "${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.resolve-version.outputs.version) }}"

      - name: Commit fnpack.json and version files
        shell: bash
        working-directory: fnpack-repo
        run: |
          if git diff --quiet -- fnpack.json core/version.go fnos/manifest README.md; then
            echo "fnpack.json 与版本文件无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fnpack.json core/version.go fnos/manifest README.md
          git commit -m "chore(release): v${{ needs.resolve-version.outputs.version }}（版本文件与 FnDepot 源）"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "推送失败，第 ${attempt} 次重试前先同步远端 main"
            git pull --rebase origin main
          done
          echo "::error::无法把版本文件与 fnpack.json 推送到 main"
          exit 1
